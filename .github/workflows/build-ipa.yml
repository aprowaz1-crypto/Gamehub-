name: Build IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build-native:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        run: |
          brew install cmake ninja flex bison
          pip3 install packaging

      - name: Build FEX iOS
        run: |
          set -o pipefail
          START=$(date +%s)
          pip3 install packaging
          echo 'Processor       : Apple M1
processor        : 0
Features         : fp asimd evtstrm aes pmull sha1 sha2 crc32 atomics fphp asimdhp sve
CPU implementer  : 0x41
CPU part         : 0xd03
CPU revision     : 4
BogoMIPS         : 48.00' > /tmp/cpuinfo
          if [ ! -f /proc/cpuinfo ]; then echo 'Patching FEX CMakeLists.txt for macOS'; python3 -c "
import re
with open('FEX/CMakeLists.txt', 'r') as f:
    content = f.read()
old = '''      execute_process(COMMAND python3 \"\${PROJECT_SOURCE_DIR}/Scripts/aarch64_fit_native.py\" \"/proc/cpuinfo\" \${CMAKE_CXX_COMPILER_VERSION}\n        OUTPUT_VARIABLE AARCH64_CPU)\n\n      string(STRIP \${AARCH64_CPU} AARCH64_CPU)\n\n      execute_process(COMMAND python3 \"\${PROJECT_SOURCE_DIR}/Scripts/NeedDisabledSVE.py\"\n        RESULT_VARIABLE NEEDS_SVE_DISABLED)\n      if (NEEDS_SVE_DISABLED)\n        message(STATUS \"Platform has bugged SVE. Disabling\")\n        set(AARCH64_CPU \"cortex-a78\")\n      endif()'''
new = '''      if(EXISTS \"/proc/cpuinfo\")\n        execute_process(COMMAND python3 \"\${PROJECT_SOURCE_DIR}/Scripts/aarch64_fit_native.py\" \"/proc/cpuinfo\" \${CMAKE_CXX_COMPILER_VERSION}\n          OUTPUT_VARIABLE AARCH64_CPU)\n\n        string(STRIP \${AARCH64_CPU} AARCH64_CPU)\n\n        execute_process(COMMAND python3 \"\${PROJECT_SOURCE_DIR}/Scripts/NeedDisabledSVE.py\"\n          RESULT_VARIABLE NEEDS_SVE_DISABLED)\n        if (NEEDS_SVE_DISABLED)\n          message(STATUS \"Platform has bugged SVE. Disabling\")\n          set(AARCH64_CPU \"cortex-a78\")\n        endif()\n      else()\n        message(STATUS \"/proc/cpuinfo not found, defaulting AARCH64_CPU to cortex-a57\")\n        set(AARCH64_CPU \"cortex-a57\")\n      endif()'''
content = content.replace(old, new)
with open('FEX/CMakeLists.txt', 'w') as f:
    f.write(content)
print('Patched FEX/CMakeLists.txt')
"; fi
          ./build/fex-ios/build.sh
          END=$(date +%s)
          echo "::notice::FEX iOS build completed in $((END - START))s"

      - name: Configure Wine (macOS)
        run: |
          set -o pipefail
          START=$(date +%s)
          mkdir -p wine/build-macos
          cd wine/build-macos
          ../configure --without-x --disable-tests --enable-win64
          END=$(date +%s)
          echo "::notice::Wine configure completed in $((END - START))s"
          cd "$GITHUB_WORKSPACE"

      - name: Build Wine ntdll unix
        run: |
          set -o pipefail
          START=$(date +%s)
          ./build/ntdll-unix/build.sh
          END=$(date +%s)
          echo "::notice::Wine ntdll unix build completed in $((END - START))s"

      - name: Build Wine wineserver
        run: |
          set -o pipefail
          START=$(date +%s)
          ./build/wineserver/build.sh
          END=$(date +%s)
          echo "::notice::Wine wineserver build completed in $((END - START))s"

      - name: Build Wine win32u unix
        run: |
          set -o pipefail
          START=$(date +%s)
          ./build/win32u-unix/build.sh
          END=$(date +%s)
          echo "::notice::Wine win32u unix build completed in $((END - START))s"

      - name: Stage licenses
        run: |
          set -o pipefail
          ./build/stage-licenses.sh

      - name: Build app
        run: |
          set -o pipefail
          START=$(date +%s)
          xcodebuild -project app/Madeira.xcodeproj \
            -target Madeira \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-" \
            build
          END=$(date +%s)
          echo "::notice::App build completed in $((END - START))s"

      - name: Package IPA
        run: |
          set -o pipefail
          START=$(date +%s)
          mkdir -p Payload
          cp -R build/Products/Debug-iphoneos/Madeira.app Payload/
          codesign --force --sign - --entitlement app/Madeira/Madeira.entitlements Payload/Madeira.app || true
          zip -r Gamehub.ipa Payload
          END=$(date +%s)
          echo "::notice::IPA packaging completed in $((END - START))s"
          ls -lh Gamehub.ipa

      - name: Verify IPA structure
        run: |
          test -d Payload/Madeira.app
          test -f Payload/Madeira.app/Info.plist
          echo "IPA structure verified"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gamehub-ipa
          path: Gamehub.ipa

  upload-release:
    needs: build-native
    runs-on: macos-14
    if: github.event_name == 'release'
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Gamehub-ipa

      - name: Upload IPA to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Gamehub.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
